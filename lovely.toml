[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Inject a new module into the game *before* a target file it loaded.
# USEFUL: For when you want to silo your code into a separate require-able module OR inject a "global" dependency before game / mod code begins execution.
[[patches]]
[patches.module]
source = "discordRPC.lua"
before = "main.lua"
name = "discordrpc"

[[patches]]
[patches.pattern]
target = '=[lovely discordrpc "main.lua"]'
pattern = "local lovely_path = false -- This line is patched, don't edit it"
position = "at"
payload = """local lovely_path = [[{{lovely_hack:patch_dir}}/]]"""
match_indent = true